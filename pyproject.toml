[project]
name = "docverse-server"
description = "Docverse documentation hosting platform server."
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
    "aiobotocore>=2.18",
    "click>=8",
    "cryptography>=48.0.1",
    "docverse",
    # FastAPI 0.140 made Dependant a slots dataclass; FastStream's FastAPI
    # plugin monkey-patches attributes onto Dependant and now raises
    # AttributeError at import/startup.
    # TODO: remove when ag2ai/faststream#2959 is fixed
    "fastapi>=0.115,<0.140",
    "httpx",
    "jinja2>=3.1",
    "pydantic>=2",
    "pydantic-settings>=2.14.2",
    "base32-lib",
    "rubin-gafaelfawr",
    "rubin-repertoire",
    "safir[db,arq,kafka]>=13",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
docverse-admin = "docverse_server.cli:main_with_sentry"

[build-system]
requires = [
    "setuptools>=75",
    "setuptools_scm[toml]>=8",
]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "asgi-lifespan",
    "coverage[toml]",
    "httpx",
    "pytest",
    "pytest-asyncio",
    "respx",
    "uv",
]
lint = [
    "prek",
    "ruff>=0.12",
]
typing = [
    "mypy>=1.15",
]
nox = [
    "nox[uv]",
    "nox-uv",
    "structlog",
    "testcontainers[postgres]",
]

[tool.uv.workspace]
members = ["client"]

[tool.uv.sources]
docverse = { workspace = true }

[tool.setuptools_scm]
# Match server release tags (e.g. "server/0.1.0"). The explicit tag_regex is
# required because setuptools_scm's default cannot parse slash-prefixed tags.
git_describe_command = [
    "git",
    "describe",
    "--dirty",
    "--tags",
    "--long",
    "--match",
    "server/[0-9]*",
]
tag_regex = '^server/(?P<version>[0-9].*)$'
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"docverse_server.storage.dashboard_templates.builtin" = [
    "*.toml",
    "*.jinja",
    "*.html",
    "*.css",
    "*.js",
    "*.svg",
    "*.png",
    "*.jpg",
    "*.jpeg",
    "*.gif",
    "*.webp",
]

[tool.ruff]
extend = "ruff-shared.toml"
# keeper/ is the legacy LTD Keeper codebase being migrated away from; it is
# not linted and will be removed once the migration is complete.
extend-exclude = ["keeper"]

[tool.ruff.lint.isort]
# ``docverse`` is the separately-distributed but co-developed client package
# (it owns the plain ``docverse`` import root); ``docverse_server`` is this
# server package. Group both as first-party. The shared ruff-shared.toml
# intentionally carries no known-first-party, so this repo-specific
# declaration lives here (matches gafaelfawr/nublado convention).
known-first-party = ["docverse", "docverse_server", "tests"]

[tool.ruff.lint.extend-per-file-ignores]
"src/docverse_server/cli.py" = [
    "A001",   # Shadowing builtin (help command).
    "ARG001", # Unused function argument (Click pattern).
    "D103",   # Missing docstring in public function (Click commands).
    "S603",   # Subprocess call with variable args (deploy-worker).
    "S607",   # Partial executable path (alembic CLI).
]
"src/docverse_server/handlers/**" = [
    "D103",  # Missing docstring in public function (handlers).
]
"tests/**" = [
    "ARG001",  # Unused function argument (mock injection).
    "D100",    # Missing docstring in public module.
    "D102",    # Missing docstring in public method.
    "D103",    # Missing docstring in public function.
    "PLR0913", # Too many arguments to function call.
    "PLR2004", # Magic value used in comparison.
    "S106",    # Possible hardcoded password.
    "S607",    # Partial executable path (npm/npx in tests).
    "SLF001",  # Private member accessed.
]
"*/tests/**" = [
    "D100",
    "D102",
    "D103",
    "PLR0913",
    "PLR2004",
    "S106",
    "SLF001",
]
"noxfile.py" = [
    "D100",
    "D103",
]
"alembic/**" = [
    "INP001",  # Alembic versions directory has no __init__.py.
    "D103",    # Missing docstring in public function.
]
"src/docverse_server/worker/**" = [
    "ARG001",  # ctx argument required by arq worker signatures.
    "RUF012", # Mutable class attributes required by arq WorkerSettings.
]

[tool.mypy]
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
mypy_path = ["src", "client/src"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "noxfile"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_uninitialized = true

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.coverage.run]
parallel = true
branch = true
source = ["docverse_server"]

[tool.coverage.paths]
source = ["src"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

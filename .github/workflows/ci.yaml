name: CI

env:
  # Current supported uv version. The uv documentation recommends pinning
  # this. The version should match the version used in
  # .pre-commit-config.yaml and frozen in uv.lock. It is updated by
  # make update-deps.
  UV_VERSION: "0.12.8"

"on":
  merge_group: {}
  pull_request: {}
  push:
    branches-ignore:
      - "dependabot/**"
      - "renovate/**"
      - "t/**"
      - "u/**"
  release:
    types: [published]

jobs:
  worker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: cloudflare-worker/package.json
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run linters
        run: uv run --only-group=lint prek run --all-files

  # Typing is its own job rather than a step of `test` so that mypy reports as
  # a separate check and does not sit in front of the (much longer) test run on
  # the critical path to `build`. Every job that gated on typing by way of
  # `test` therefore lists `typing` in its `needs`.
  typing:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for setuptools_scm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run typing
        run: uv run --only-group=nox nox -s typing

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run tests
        run: uv run --only-group=nox nox -s test

  client-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: |
            3.12
            3.13

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run client tests
        run: >-
          uv run --only-group=nox nox -s
          client_test
          client_test_compat
          client_test_oldest

  deploy-worker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: cloudflare-worker/package.json
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci
        working-directory: cloudflare-worker

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run deploy-worker integration test
        run: uv run --only-group=nox nox -s deploy_worker_test

  build:
    concurrency:
      group: docker
      queue: max
    needs: [typing, test, client-test, worker-test, deploy-worker-test]
    uses: lsst-sqre/multiplatform-build-and-push/.github/workflows/build.yaml@v4
    with:
      images: ghcr.io/${{ github.repository }}
      # Only push on server releases (tags like "server/0.1.0") and ticket
      # branch PRs. Non-matching PRs still build the image as validation but
      # skip the push + manifest steps — this lets the required
      # `build / manifest` check report as "Skipped" (which counts as
      # passing) instead of hanging in "Expected" forever on dependabot
      # and similar PRs.
      push: >-
        ${{ (github.event_name == 'release'
             && startsWith(github.event.release.tag_name, 'server/'))
            || (github.event_name != 'merge_group'
                && (startsWith(github.head_ref, 'tickets/')
                    || startsWith(github.head_ref, 't/'))) }}

  client-package:
    name: Build client package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs on every CI run, not just releases, so a packaging regression
    # (missing files, bad metadata, a version setuptools_scm can't derive)
    # surfaces on the PR rather than on release day. The artifact it
    # uploads is what client-pypi publishes: the release never rebuilds.
    #
    # hynek's action is used instead of lsst-sqre/build-and-publish-to-pypi
    # because the client is a uv workspace member: `uv build` inside
    # `client/` writes to the *workspace root's* dist/, so a publish step
    # that looks in `client/dist/` finds nothing. This action passes an
    # explicit --out-dir and also inspects the wheel and sdist (contents
    # tree, twine check, metadata render) in the job summary.
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for setuptools_scm

      - name: Build and inspect the client package
        id: build
        uses: hynek/build-and-inspect-python-package@v3.0.1
        with:
          path: client

  client-pypi:
    name: Upload client to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typing, test, client-test, client-package]
    environment:
      name: pypi
      url: https://pypi.org/p/docverse
    permissions:
      id-token: write # trusted publishing
    if: >
      github.event_name == 'release'
      && startsWith(github.event.release.tag_name, 'client/')

    steps:
      - name: Download the built package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.client-package.outputs.artifact-name }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

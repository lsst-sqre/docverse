version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "03:00"
      timezone: "America/New_York"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/cloudflare-worker"
    schedule:
      interval: "monthly"
      time: "03:00"
      timezone: "America/New_York"
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # @cloudflare/vitest-pool-workers pins vitest as a ^4 peer dependency, so
      # a vitest major inside the npm group makes `npm ci` fail on ERESOLVE and
      # blocks every other bump in the group. Take vitest majors deliberately,
      # once the pool package supports them.
      - dependency-name: "vitest"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "03:00"
      timezone: "America/New_York"
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

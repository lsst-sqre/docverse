[project]
name = "docverse"
description = "Python client for the Docverse documentation hosting platform."
license = "MIT"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "click>=8",
    "httpx>=0.25",
    "pydantic>=2.5",
]

[project.scripts]
docverse = "docverse._cli:main"

[build-system]
requires = [
    "setuptools>=75",
    "setuptools_scm[toml]>=8",
]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "coverage[toml]",
    "pytest",
    "pytest-asyncio",
    "respx",
]

[tool.setuptools_scm]
root = ".."
# Match client release tags (e.g. "client/0.1.0"). The explicit tag_regex is
# required because setuptools_scm's default cannot parse slash-prefixed tags.
tag_regex = '^client/(?P<version>[0-9].*)$'
git_describe_command = [
    "git",
    "describe",
    "--dirty",
    "--tags",
    "--long",
    "--match",
    "client/[0-9]*",
]
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend = "../ruff-shared.toml"

[tool.ruff.lint.extend-per-file-ignores]
"src/docverse/_cli.py" = [
    "PLR0917", # Too many positional arguments (Click builds the CLI from
               # the decorated command signature; nothing calls it directly).
]

[tool.coverage.run]
parallel = true
branch = true
source = ["docverse"]

[tool.coverage.paths]
source = ["src"]

[tool.coverage.report]
show_missing = true
